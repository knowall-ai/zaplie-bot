# Dependabot — automated dependency update PRs.
# PR titles use the `deps:` / `ci:` prefixes so they pass PR Lint
# (which also skips its Fixes/test-plan checks for dependabot[bot]).
#
# Packages with peer-dependency relationships are grouped across ALL
# update types. A major bump to one half of such a pair on its own cannot
# install (`npm ci` fails with ERESOLVE), so the PR can never go green —
# they have to move together.
version: 2
updates:
  # Bot / backend (repo root)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      # eslint and the typescript-eslint plugins are peer-linked:
      # @typescript-eslint/* v7 requires eslint ^8.56, so bumping eslint
      # alone to v9/v10 breaks installation.
      eslint:
        patterns:
          - 'eslint'
          - '@typescript-eslint/*'
      # One PR for all remaining minor/patch bumps to keep the noise down.
      # Majors get individual PRs, except for the peer-linked groups above,
      # which are deliberately grouped across every update type.
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # ESLint 9+ dropped .eslintrc support, so this major needs a flat-config
      # migration rather than a version bump — see #236. Minor/patch still flow.
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@typescript-eslint/*'
        update-types:
          - 'version-update:semver-major'

  # React web app
  - package-ecosystem: 'npm'
    directory: '/tabs'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      # msal-react declares a peer range on msal-browser.
      msal:
        patterns:
          - '@azure/msal-*'
      # react, react-dom and their @types must stay on the same major.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Each of these majors needs a deliberate migration, not a version bump
      # (see #236, and #234 for web-vitals). Minor/patch updates still flow.
      - dependency-name: '@azure/msal-*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react-dom'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/react-dom'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'web-vitals'
        update-types:
          - 'version-update:semver-major'

  # Azure Functions
  - package-ecosystem: 'npm'
    directory: '/functions'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
